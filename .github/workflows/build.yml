name: Build

on:
  push:
    paths-ignore:
      - '*.md'
      - 'LICENSE*'
  pull_request:

jobs:
  build-linux:
    name: Build Linux
    strategy:
      matrix:
        include:
          - name: x86_64
            platform: linux/amd64
          - name: i686
            platform: linux/386
          - name: armv7l
            platform: linux/arm/v7
          - name: aarch64
            platform: linux/arm64/v8
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        run: >
          docker buildx build --target export --output build .
          --platform ${{ matrix.platform }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: build

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: ./build-macos.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build

  build-windows:
    name: Build Windows
    strategy:
      matrix:
        include:
          - name: x86_64
            sys: clang64
          # - name: arm64
          #   sys: clangarm64
      fail-fast: false
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          install: bison curl diffutils flex make patch perl texinfo
          pacboy: clang:p
      - name: Build
        shell: msys2 {0}
        run: ./build-windows.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: build

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [ build-linux, build-macos, build-windows ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -R artifacts
      - name: Create archives
        working-directory: artifacts
        run: for f in *; do zip -jr $f.zip $f; done
      - name: Release
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          files: artifacts/*.zip
