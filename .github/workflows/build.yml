name: Build

on:
  push:
    paths-ignore:
      - '*.md'
      - 'LICENSE*'
  pull_request:
  workflow_dispatch:
    inputs:
      windows_x86_base_opt_level:
        description: Base optimization level for the Windows x86 host compiler build
        required: false
        default: O3
      windows_x86_host_o1_sources:
        description: Comma or whitespace separated host frontend sources to force to -O1 (for example cp/lex.c cp/spew.c)
        required: false
        default: ''
      windows_x86_host_o0_sources:
        description: Comma or whitespace separated host frontend sources to force to -O0
        required: false
        default: ''

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: docker build --target export --output build .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: build

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install bison gperf
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: ./build-macos.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build

  build-windows:
    name: Build Windows
    strategy:
      matrix:
        include:
          - name: x86
            sys: MINGW32
            host_triple: i686-w64-mingw32
          - name: x64
            sys: MINGW64
            host_triple: x86_64-w64-mingw32
          # - name: arm64
          #   sys: clangarm64
      fail-fast: false
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          install: bison curl diffutils flex gawk gperf make patch perl python unzip
          pacboy: toolchain:p
      - name: Build
        shell: msys2 {0}
        env:
          HOST_TRIPLE: ${{ matrix.host_triple }}
          WINDOWS_X86_BASE_OPT_LEVEL: ${{ matrix.name == 'x86' && github.event_name == 'workflow_dispatch' && github.event.inputs.windows_x86_base_opt_level || '' }}
          HOST_O1_SOURCES: ${{ matrix.name == 'x86' && github.event_name == 'workflow_dispatch' && github.event.inputs.windows_x86_host_o1_sources || '' }}
          HOST_O0_SOURCES: ${{ matrix.name == 'x86' && github.event_name == 'workflow_dispatch' && github.event.inputs.windows_x86_host_o0_sources || '' }}
        run: ./build-windows.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}
          path: build

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [ build-linux, build-macos, build-windows ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -R artifacts
      - name: Create archives
        working-directory: artifacts
        run: for f in *; do zip -qry "$f.zip" "$f"; done
      - name: Release
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          files: artifacts/*.zip
